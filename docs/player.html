<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="player-page">
  <div id="wrap">
    <nav id="top"><a id="back" href="index.html">← Back</a> <span id="label"></span></nav>
    <div id="stage">
      <div id="frame"><div id="yt"></div></div>
      <!-- Covers the iframe: blocks hover UI, and hides title, thumbnail and pause suggestions -->
      <button id="cover" type="button" aria-label="Play">Tap to play</button>
    </div>
    <div id="controls" role="toolbar" aria-label="Player controls">
      <button type="button" data-seek="-60" aria-label="Back 60 seconds">−60</button>
      <button type="button" data-seek="-10" aria-label="Back 10 seconds">−10</button>
      <button type="button" id="play" aria-label="Play or pause">Play</button>
      <button type="button" data-seek="10" aria-label="Forward 10 seconds">+10</button>
      <button type="button" data-seek="60" aria-label="Forward 60 seconds">+60</button>
      <label class="speed">Speed
        <select id="speed">
          <option>1</option><option>1.25</option><option>1.5</option><option>1.75</option><option>2</option>
        </select>
      </label>
      <span id="elapsed" aria-label="Elapsed time">0:00</span>
      <button type="button" id="fs" aria-label="Full screen" aria-pressed="false">Full screen</button>
    </div>
    <p id="msg" role="status"></p>
    <p id="after"><a id="next" hidden>Next game →</a></p>
  </div>
  <script src="player.js" type="module"></script>
</body>
</html>
